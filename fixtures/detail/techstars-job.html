tialized":false},"companyDetails":{"id":null,"jobs":[]},"loading":{"jobRequest":false},"api":{},"companies":{"found":[],"total":0,"initialized":false,"isLoading":false,"isLazyLoading":false,"isFilterLoading":false},"jobs":{"found":[],"currentJob":{"applicationMethod":"method_not_defined","applicationPath":null,"compensationCurrency":null,"compensationPeriod":"period_not_defined","compensationAmountMinCents":null,"compensationAmountMaxCents":null,"compensationOffersEquity":null,"compensationPublic":true,"description":"\u003cdiv\u003e \u003cstrong\u003eJob Description\u003cbr\u003e\u003cbr\u003e\u003c/strong\u003eWe are seeking a Product Engineer to take end-to-end ownership of the product — from shaping product decisions to bringing them to life through frontend development.\u003cbr\u003e\u003cbr\u003eAs a product engineer in the Account team at Wix Payments, you'll own payment products end-to-end, from shaping what gets built to designing the experience, building the client, and working on services behind it. You'll enable users across Wix, Base44, and beyond to accept payments and stay compliant while navigating complex regulations across multiple countries. You’ll also use AI as part of your workflow to explore ideas, prototype, and write code.\u003cbr\u003e\u003cbr\u003eIn your day-to-day, you will:\u003cbr\u003e\u003cbr\u003e\u003cul\u003e \u003cli\u003e Own payment products from idea to production, including product thinking, UX, client, and the APIs behind them\u003c/li\u003e \u003cli\u003e Decide how things should work, not just how they're built, together with product managers and designers\u003c/li\u003e \u003cli\u003e Build payment flows used by millions of people across dozens of markets, handling failures and edge cases with components and APIs that scale as we add payment methods and regulations\u003c/li\u003e \u003cli\u003e Use AI for exploring ideas, prototyping, and writing code, ensuring high-quality standards for what ships\u003c/li\u003e \u003cli\u003e Work with TypeScript, React, Node.js, cloud, and CI/CD, while adopting new tools as they emerge\u003cbr\u003e\u003cbr\u003e \u003c/li\u003e \u003c/ul\u003e \u003cstrong\u003eQualifications\u003cbr\u003e\u003cbr\u003e\u003c/strong\u003e\u003cul\u003e \u003cli\u003e 3+ years as a software engineer, with real ownership of things running in production\u003c/li\u003e \u003cli\u003e Deep frontend expertise, and the drive to work outside it\u003c/li\u003e \u003cli\u003e Solid design skills: components, state, APIs, and data flows that scale with the product\u003c/li\u003e \u003cli\u003e Experience working with AI tools, and good judgment about what they produce\u003c/li\u003e \u003cli\u003e Curiosity about the whole system, from how a button feels to how the service behind it runs\u003c/li\u003e \u003cli\u003e Care about correctness. In payments, a bug isn't a broken layout but someone's money\u003c/li\u003e \u003cli\u003e Payments experience – an advantage\u003cbr\u003e\u003cbr\u003e \u003c/li\u003e \u003c/ul\u003e \u003cstrong\u003eAdditional Information\u003cbr\u003e\u003cbr\u003e\u003c/strong\u003eWe’re the Wix Payments team. We provide Wix users with the best way to collect payments from their customers and manage their Wix income online, in person, and on-the-go. We’re passionate about crafting the best experience for our users, and empowering any business on Wix to realize its full financial potential. We have developed our own custom payment processing solution that blends many integrations into one clean and intuitive user interface. We also build innovative products that help our users manage their cash and grow their business. We are fun, passionate and love what we do. We move fast in a dynamic work environment, so you’ll be able to ship products that have an immediate impact on millions of users across the globe. \u003c/div\u003e","descriptionLastUpdatedAt":"2026-08-22T23:34:19.182Z","employmentTypes":["full_time"],"expiresAt":null,"id":90888284,"locatio
