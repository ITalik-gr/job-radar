name: Deploy

# The build and deploy live here, not in Workers Builds on Cloudflare's side.
# Reason: the build there used to hang at the Initializing stage, before the repo was
# even cloned, and no code change affected it. Here the whole chain is visible in GitHub
# logs, the step that failed is clear, and any run can be repeated with a button.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Two pushes in a row must not deploy at the same time: whichever finishes last wins,
# and that is not necessarily the newer commit.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # Takes the pnpm version from the packageManager field in package.json, the Node version from .node-version.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      # --ignore-scripts is mandatory here. Among the dependencies is better-sqlite3, a native
      # driver for local work. In CI it builds through node-gyp for several minutes, or hangs
      # outright, and the worker does not need it: in the cloud the database is D1.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # There is one worker and it is production, so a broken build is better stopped here.
      - name: Check types
        run: |
          pnpm typecheck
          pnpm exec tsc --noEmit -p web/tsconfig.json

      - name: Build the frontend
        run: pnpm build:web

      # Personal values (database id, From name, gateway) are not in the repo. They come from
      # the WRANGLER_LOCAL_JSONC secret, the same content as your local wrangler.local.jsonc.
      # Without the secret the generic config deploys and wrangler looks the database up by
      # name, which needs D1 permissions on the token.
      - name: Build the deploy config
        run: |
          if [ -n "$WRANGLER_LOCAL_JSONC" ]; then
            printf '%s' "$WRANGLER_LOCAL_JSONC" > wrangler.local.jsonc
          else
            echo "::warning::WRANGLER_LOCAL_JSONC is not set, deploying the generic config"
          fi
          node scripts/wrangler-config.mjs
        env:
          WRANGLER_LOCAL_JSONC: ${{ secrets.WRANGLER_LOCAL_JSONC }}

      # D1 migrations are intentionally not here: deploying the worker does not run them,
      # and applying the schema automatically on every push is dangerous. After pnpm
      # db:generate, run this once from your laptop: pnpm cf:migrate
      - name: Deploy the worker
        run: pnpm exec wrangler deploy --config wrangler.deploy.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Deploying the worker does not run migrations, and the production schema can lag
      # behind the code. Then the tables are there but a column is missing, and the
      # Companies page returns 500. This step changes nothing in the database, it just
      # loudly says that pnpm cf:migrate needs to be run.
      - name: Check the production schema
        run: |
          if [ -z "$WEB_URL" ]; then
            echo "WEB_URL is not set, skipping the schema check"
            exit 0
          fi
          body=$(curl -s --max-time 20 "$WEB_URL/api/health?deep=1")
          echo "$body"
          echo "$body" | grep -q '"db":"ok"' || {
            echo "::error::the production schema is behind the code, run pnpm cf:migrate"
            exit 1
          }
        env:
          # Address of your own worker. Set as a repository variable (Settings, Variables),
          # so a public repo does not carry someone else's. Empty means the step is skipped.
          WEB_URL: ${{ vars.WEB_URL }}
